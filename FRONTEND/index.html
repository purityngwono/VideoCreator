<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoCreator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">VideoCreator</div>

        <button class="new-video-btn" id="newVideoBtn">
            + New Video
        </button>
    </header>

    <main class="container">

        <section class="hero">
            <h1>Turn your idea into a video.</h1>

            <p>
                Create stories, shorts, animations, educational videos,
                music videos and more.
            </p>

            <button class="create-btn" id="createBtn">
                + Create New Video
            </button>
        </section>

        <section class="projects-section">

            <h2>Recent Projects</h2>

            <div class="empty-state">
                <div class="empty-icon">🎬</div>

                <h3>No projects yet</h3>

                <p>
                    Your created videos will appear here.
                </p>
            </div>

        </section>

    </main>

    <!-- Load engines FIRST -->
    <script src="sceneengine.js"></script>
    <script src="videoengine.js"></script>

    <!-- Then application logic -->
    <script src="app.js"></script>
    <script src="script.js"></script>

</body>
</html>
